

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather | Modern Weather App</title>

    <!-- Bootstrap -->
    <link rel="stylesheet" href="css/bootstrap.min.css">

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">

    <!-- Main CSS -->
    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <!-- =========================
         START HEADER
    ========================== -->

    <div class="site-header">

        <div class="container d-flex align-items-center justify-content-between">

            <a href="index.html" class="branding d-flex align-items-center">

                <img src="img/logo.png" alt="Weather Logo" class="logo">

                <div class="logo-type px-4">

                    <h1 class="site-title">
                        Weather
                    </h1>

                    <small class="site-description">
                        tagline goes here
                    </small>

                </div>

            </a>


            <div class="main-navigation">

                <ul class="menu d-flex">

                    <li class="menu-item current-menu-item px-3">
                        <a href="index.html">Home</a>
                    </li>

                    <li class="menu-item px-3">
                        <a href="#">News</a>
                    </li>

                    <li class="menu-item">
                        <a href="#">Live cameras</a>
                    </li>

                    <li class="menu-item">
                        <a href="#">Photos</a>
                    </li>

                    <li class="menu-item">
                        <a href="#">Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </div>

    <!-- =========================
         END HEADER
    ========================== -->


    <!-- =========================
         START HERO
    ========================== -->

    <div class="hero">

        <div class="container">

            <form class="find-location">

                <input
                    type="text"
                    placeholder="Find your location..."
                    id="search"
                >

                <input
                    type="button"
                    value="Find"
                    id="submit"
                >

            </form>

        </div>

    </div>

    <!-- =========================
         END HERO
    ========================== -->


    <!-- =========================
         START FORECAST TABLE
    ========================== -->

    <div class="forecast-table">

        <div class="container">

            <div class="forecast-container d-flex">

                <div class="row w-100 p-0" id="forecast">


                    <!-- TODAY -->

                    <div class="today forecast px-3 col-lg-4">

                        <div
                            class="forecast-header d-flex justify-content-between"
                            id="today"
                        >

                            <p
                                id="today-date-day-name"
                                class="day"
                            >
                                Thursday
                            </p>

                            <span>

                                <span
                                    id="today-date-day-num"
                                    class="date"
                                >
                                    16
                                </span>

                                <span
                                    id="today-date-month"
                                    class="date"
                                >
                                    September
                                </span>

                            </span>

                        </div>


                        <div
                            class="forecast-content"
                            id="current"
                        >

                            <div
                                id="today-location"
                                class="location"
                            >
                                Cairo
                            </div>


                            <div class="degree d-flex align-items-center">

                                <span>

                                    <span id="today-temp">
                                        31
                                    </span>

                                    <span class="fs-1 fw-bolder">
                                        <sup>o</sup>C
                                    </span>

                                </span>


                                <div class="forecast-icon">

                                    <img
                                        id="today-condition-img"
                                        src="img/image (2).png"
                                        alt="Weather condition"
                                        class="w-100"
                                    >

                                </div>

                            </div>


                            <p
                                id="today-condition-text"
                                class="custom"
                            >
                                Partly cloudy
                            </p>


                            <div class="item-footer d-flex text-light p-3">

                                <div class="d-flex me-auto">

                                    <img
                                        class="px-1"
                                        src="img/image (2).png"
                                        alt=""
                                    >

                                    <p id="humidity">
                                        20%
                                    </p>

                                </div>


                                <div class="d-flex me-auto">

                                    <img
                                        class="px-1"
                                        src="img/image (1).png"
                                        alt=""
                                    >

                                    <p id="wind">
                                        20 km/h
                                    </p>

                                </div>


                                <div class="d-flex me-auto">

                                    <img
                                        class="px-1"
                                        src="img/image.png"
                                        alt=""
                                    >

                                    <p id="wind-direction">
                                        E
                                    </p>

                                </div>

                            </div>

                        </div>

                    </div>


                    <!-- NEXT DAY -->

                    <div class="forecast text-center px-3 col-lg-4">

                        <div class="forecast-header">

                            <div class="day next-day-name"></div>

                        </div>


                        <div class="forecast-content">

                            <div class="forecast-icon py-1">

                                <img
                                    src="img/116.png"
                                    class="next-condition-img"
                                    alt=""
                                    width="48"
                                >

                            </div>


                            <h3>

                                <span class="next-max-temp degree"></span>

                                <span class="degree py-1">
                                    <sup>o</sup>C
                                </span>

                            </h3>


                            <h3>

                                <span class="next-min-temp degree"></span>

                                <span class="degree py-1">
                                    <sup>o</sup>C
                                </span>

                            </h3>


                            <p class="next-condition-text custom py-1"></p>

                        </div>

                    </div>


                    <!-- THIRD DAY -->

                    <div class="forecast text-center px-3 col-lg-4">

                        <div class="forecast-header">

                            <div class="day next-day-name">
                                Friday
                            </div>

                        </div>


                        <div class="forecast-content">

                            <div class="forecast-icon py-1">

                                <img
                                    src="img/116.png"
                                    class="next-condition-img"
                                    alt=""
                                    width="48"
                                >

                            </div>


                            <h3>

                                <span class="next-max-temp degree"></span>

                                <span class="degree py-1">
                                    <sup>o</sup>C
                                </span>

                            </h3>


                            <h3>

                                <span class="next-min-temp degree"></span>

                                <span class="degree py-1">
                                    <sup>o</sup>C
                                </span>

                            </h3>


                            <p class="next-condition-text custom py-1">
                                Partly cloudy
                            </p>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- =========================
         END FORECAST TABLE
    ========================== -->


    <!-- =========================
         START FOOTER
    ========================== -->

    <footer class="site-footer">

        <div class="container">

            <div class="row align-items-center">

                <div class="col-md-8">

                    <form
                        action="#"
                        class="subscribe-form position-relative"
                    >

                        <input
                            type="text"
                            placeholder="Enter your email to subscribe..."
                        >

                        <input
                            type="submit"
                            value="Subscribe"
                        >

                    </form>

                </div>


                <div class="col-md-4 px-5">

                    <div class="social-links d-flex">

                        <a
                            class="d-flex justify-content-center align-items-center"
                            href="#"
                        >
                            <i class="fab fa-facebook-f"></i>
                        </a>


                        <a
                            class="d-flex justify-content-center align-items-center"
                            href="#"
                        >
                            <i class="fab fa-twitter"></i>
                        </a>


                        <a
                            class="d-flex justify-content-center align-items-center"
                            href="#"
                        >
                            <i class="fab fa-google-plus"></i>
                        </a>


                        <a
                            class="d-flex justify-content-center align-items-center"
                            href="#"
                        >
                            <i class="fab fa-pinterest"></i>
                        </a>

                    </div>

                </div>

            </div>


            <p class="colophon">
                Copyright 2014 Company name.
                Designed by Alaa.
                All rights reserved
            </p>

        </div>

    </footer>

    <!-- =========================
         END FOOTER
    ========================== -->


    <!-- JavaScript -->
    <script src="js/main.js"></script>

</body>

</html>
